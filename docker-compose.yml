services:
  app:
    build: .
    ports:
      - "3001:3000"
    read_only: true
    environment:
      - db__host=conversation-data-service-db
      - db__password=conversation-data-service
    healthcheck:
      test: ["/app/server", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      conversation-data-service-db:
        condition: service_healthy

  conversation-data-service-db:
    image: postgres:18
    environment:
      POSTGRES_DB: conversation-data-service
      POSTGRES_USER: conversation-data-service
      POSTGRES_PASSWORD: conversation-data-service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conversation-data-service"]
      interval: 2s
      timeout: 5s
      retries: 20
